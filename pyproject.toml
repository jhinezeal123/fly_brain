[project]
name = "fly-depth"
version = "0.2.0"
description = "Monocular depth probing with the real MaleCNS v1.0 visual connectome"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.10",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "Pillow>=10.0",
  "pyarrow>=15.0",
  "PyYAML>=6.0",
  "scipy>=1.12",
  "torch>=2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
